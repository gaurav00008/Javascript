<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPEND ELEMENT</title>
</head>
<body style="background-color: black; color: #fff;" >
    
    <ul class="language">
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>PHP</li>
        <li>JAVA</li>
        <li>DOT NET</li>
    </ul>


<script>
  function addLanguage(langName) {
    const li = document.createElement('li');
    li.innerHTML = `${langName}`
    document.querySelector('.language').appendChild(li)
}

addLanguage("NODE JS")  
addLanguage("Python")

/*OPTMIZATION OF THIS METHOD*/

function addOptiLanguage(langName){
    const li=  document.createElement('li')
    li.appendChild(document.createTextNode(langName))
    document.querySelector('.langauge').appendChild(li)
}


addOptiLanguage('GO LANG')




//EDIT
const secondLang = document.querySelector("li:nth-child(2)")
secondLang.innerHTML = "C#"
/*Though using this method we can edit the text but it is not optimized because this first selects the innerHTML of the tree structer and it takes a lot of time*/


/*SECOND APPROACH TO EDIT*/
const newli = document.createElement('li')
newli.textContent = "MOJO"
secondLang.replaceWith(newli)



/*ANOTHER METHOD TO EDIT*/ 
const firstLang  = document.querySelector("li:first-child")
firstLang.outerHTML = '<li>Typescript</li>'



//remove
const lastLang = document.querySelector('li:last-child')
lastLang.remove()



</script>



</body>
</html>
